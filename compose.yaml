# Local development services. Run the app itself with your local PHP 8.5 (e.g. Herd) or:
#   docker compose run --rm php php artisan …
services:
  pgsql:
    image: postgres:17
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: complyrobin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgsql:/var/lib/postgresql/data
      - ./database/sql:/sql:ro
      - ./docker/pgsql/init.sh:/docker-entrypoint-initdb.d/10-complyrobin.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  php:
    build: ./docker/php
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: pgsql
    depends_on:
      pgsql:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgsql:
