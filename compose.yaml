# Local development services. Run the app itself with your local PHP 8.5 (e.g. Herd) or:
#   docker compose run --rm php php artisan …
services:
  pgsql:
    image: postgres:17
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: complyrobin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgsql:/var/lib/postgresql/data
      - ./database/sql:/sql:ro
      - ./docker/pgsql/init.sh:/docker-entrypoint-initdb.d/10-complyrobin.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  # A transaction-mode pooler like Laravel Cloud's. To run the suite through it (migrations go direct):
  #   DB_PORT=6432 DB_DIRECT_HOST=127.0.0.1 DB_DIRECT_PORT=5432 DB_EXPECT_POOLER=true composer test
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "${FORWARD_POOLER_PORT:-6432}:6432"
    volumes:
      - ./docker/pgbouncer:/etc/pgbouncer:ro
    depends_on:
      pgsql:
        condition: service_healthy

  php:
    build: ./docker/php
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: pgsql
    depends_on:
      pgsql:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgsql:
