name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest

    # direct: the app talks to Postgres. pooled: through PgBouncer in transaction mode with one server connection per
    # role, as on Laravel Cloud with DB_POOLING=true; migrations still go direct.
    strategy:
      fail-fast: false
      matrix:
        db: [direct, pooled]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: complyrobin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_PORT: ${{ matrix.db == 'pooled' && '6432' || '5432' }}
      DB_DIRECT_HOST: ${{ matrix.db == 'pooled' && '127.0.0.1' || '' }}
      DB_DIRECT_PORT: ${{ matrix.db == 'pooled' && '5432' || '' }}
      DB_EXPECT_POOLER: ${{ matrix.db == 'pooled' && 'true' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, intl, zip, gd, bcmath, exif, pcntl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create database roles
        run: |
          psql -d postgres -c "CREATE DATABASE complyrobin_test"
          for db in complyrobin complyrobin_test; do
            psql -v ON_ERROR_STOP=1 -d "$db" \
              -v migrator_password=migrator -v tenant_password=tenant -v platform_password=platform \
              -f database/sql/roles.sql
          done
          # CI only, never production: the migrator creates the per-process databases of parallel test runs.
          psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER ROLE app_migrator CREATEDB"

      - name: Start PgBouncer
        if: matrix.db == 'pooled'
        run: |
          docker run -d --name pgbouncer --add-host pgsql:host-gateway -p 6432:6432 \
            -v "$GITHUB_WORKSPACE/docker/pgbouncer:/etc/pgbouncer:ro" edoburu/pgbouncer:v1.24.1-p1
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 6432 && exit 0; sleep 1; done
          docker logs pgbouncer
          exit 1

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --database=pgsql_migrator --force
          php artisan db:verify-roles

      - name: Code style (Pint)
        if: matrix.db == 'direct'
        run: composer lint

      - name: Static analysis (Larastan)
        if: matrix.db == 'direct'
        run: composer analyse

      - name: Refactoring check (Rector)
        if: matrix.db == 'direct'
        run: composer refactor

      - name: Tests (Pest)
        run: composer test

      - name: Security audit
        if: matrix.db == 'direct'
        run: composer audit
