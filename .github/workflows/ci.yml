name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: complyrobin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, intl, zip, gd, bcmath, exif, pcntl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create database roles
        run: |
          psql -d postgres -c "CREATE DATABASE complyrobin_test"
          for db in complyrobin complyrobin_test; do
            psql -v ON_ERROR_STOP=1 -d "$db" \
              -v migrator_password=migrator -v tenant_password=tenant -v platform_password=platform \
              -f database/sql/roles.sql
          done

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --database=pgsql_migrator --force

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Refactoring check (Rector)
        run: composer refactor

      - name: Tests (Pest)
        run: composer test

      - name: Security audit
        run: composer audit
