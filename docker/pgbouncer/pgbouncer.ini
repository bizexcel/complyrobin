; A transaction-mode pooler like Laravel Cloud's, for proving tenancy is safe behind one (local and CI only).
; default_pool_size = 1 makes every client of a role share a single server connection, so any session state
; one client leaves behind is seen by the next: the worst case for leaks.
[databases]
* = host=pgsql port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 1
reserve_pool_size = 0
max_client_conn = 200
query_wait_timeout = 15
server_reset_query =
ignore_startup_parameters = extra_float_digits
